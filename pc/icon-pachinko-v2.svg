<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0d3b80"/>
      <stop offset="55%" stop-color="#071a38"/>
      <stop offset="100%" stop-color="#03070f"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff334d"/>
      <stop offset="45%" stop-color="#ff1010"/>
      <stop offset="100%" stop-color="#8d0000"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#aeb8c8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="78%" stop-color="#5b6678"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff86a"/>
      <stop offset="100%" stop-color="#ffd500"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28ff7e"/>
      <stop offset="100%" stop-color="#00a84c"/>
    </linearGradient>
    <filter id="glowR"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowB"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".75"/></filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="#02050b"/>
  <rect x="16" y="16" width="480" height="480" rx="82" fill="url(#bg)" stroke="url(#red)" stroke-width="18" filter="url(#glowR)"/>

  <!-- decorative pachinko ring -->
  <circle cx="256" cy="258" r="188" fill="none" stroke="#0f66ff" stroke-width="12" opacity=".65" filter="url(#glowB)"/>
  <circle cx="256" cy="258" r="166" fill="none" stroke="#ff1c2e" stroke-width="7" opacity=".7"/>
  <g fill="#ffffff">
    <circle cx="102" cy="148" r="9"/><circle cx="410" cy="148" r="9"/>
    <circle cx="82" cy="260" r="8"/><circle cx="430" cy="260" r="8"/>
    <circle cx="120" cy="372" r="9"/><circle cx="392" cy="372" r="9"/>
  </g>

  <!-- beginner mark -->
  <g filter="url(#shadow)">
    <path d="M164 112 Q164 95 180 95 L256 168 L332 95 Q348 95 348 112 L348 264 L256 344 L164 264 Z"
          fill="#111820" stroke="url(#metal)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M183 128 L246 188 L246 303 L183 248 Z" fill="url(#yellow)"/>
    <path d="M329 128 L266 188 L266 303 L329 248 Z" fill="url(#green)"/>
    <path d="M256 183 L256 309" stroke="#ffffff" stroke-width="5" opacity=".7"/>
  </g>

  <!-- pachinko balls -->
  <g fill="url(#metal)" stroke="#ff2b2b" stroke-width="5" filter="url(#shadow)">
    <circle cx="118" cy="302" r="25"/>
    <circle cx="390" cy="306" r="25"/>
    <circle cx="256" cy="398" r="28"/>
  </g>
  <g fill="#ffffff" opacity=".88">
    <circle cx="109" cy="293" r="7"/><circle cx="381" cy="297" r="7"/><circle cx="246" cy="388" r="8"/>
  </g>

  <!-- bold PC indicator -->
  <g transform="translate(0,8)" filter="url(#shadow)">
    <rect x="162" y="354" width="188" height="92" rx="28" fill="url(#red)" stroke="url(#metal)" stroke-width="7"/>
    <text x="256" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="54" fill="#ffffff">PC</text>
  </g>
</svg>